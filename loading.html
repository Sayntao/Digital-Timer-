<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loading</title>
    <style>
        body{
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        div{
            width: 50px;
            height: 50px;
            border-radius: 50% ;
            border: 10px solid rgb(195, 195, 255);
            border-top-color:red;
            animation: spin 3 ;
            display: flex;
        }
        @keyframes spin{
            25%{border-top-color: rgb(255, 174, 0);}
            50%{border-top-color: greenyellow;}
            75%{border-top-color: rgb(0, 81, 255);}
            
            100%{transform: rotate(360deg);}
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
